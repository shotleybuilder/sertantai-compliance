name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  MIX_ENV: test
  ELIXIR_VERSION: '1.20.4'
  OTP_VERSION: '29.1.1'
  NODE_VERSION: '22.x'  # match frontend/Dockerfile

jobs:
  backend-checks:
    name: Backend Quality Checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sertantai_compliance_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5436:5432  # config/test.exs uses 5436 (shared legal DB port in dev)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            backend/deps
            backend/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('backend/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Cache Dialyzer PLT
        uses: actions/cache@v4
        with:
          path: backend/priv/plts
          key: ${{ runner.os }}-dialyzer-${{ hashFiles('backend/mix.lock') }}-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}
          restore-keys: |
            ${{ runner.os }}-dialyzer-

      - name: Install dependencies
        working-directory: backend
        run: mix deps.get

      - name: Check formatting
        working-directory: backend
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        working-directory: backend
        run: mix compile --warnings-as-errors

      - name: Run Credo
        working-directory: backend
        run: mix credo --only design,consistency --strict

      - name: Check Ash codegen
        working-directory: backend
        run: mix ash.codegen --check

      - name: Run Dialyzer
        working-directory: backend
        run: mix dialyzer --format github

      - name: Run Sobelow
        working-directory: backend
        run: mix sobelow --config  # .sobelow-conf: exit on high, same as pre-push

      - name: Security audit
        working-directory: backend
        # Same accepted-advisory list as .githooks/pre-push
        run: |
          IGNORE=$(grep -v '^#' .deps-audit-ignore | grep -v '^$' | paste -sd, -)
          mix deps.audit ${IGNORE:+--ignore-advisory-ids=$IGNORE}

      - name: Check unused dependencies
        working-directory: backend
        run: mix deps.unlock --check-unused

      - name: Run tests
        working-directory: backend
        run: mix test

  frontend-checks:
    name: Frontend Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Check formatting
        working-directory: frontend
        run: npm run format:check

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npm run check

      - name: Run tests
        working-directory: frontend
        run: npm run test:run

      - name: Build
        working-directory: frontend
        run: npm run build

